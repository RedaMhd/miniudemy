events {
    worker_connections 1024;
}

http {
    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream auth_service {
        server auth-service:5001;
    }

    upstream course_service {
        server course-service:5002;
    }

    upstream progress_service {
        server progress-service:5003;
    }

    upstream notification_service {
        server notification-service:5004;
    }

    # ── Server ────────────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Health check endpoint for the gateway itself
        location /health {
            return 200 'API Gateway OK\n';
            add_header Content-Type text/plain;
        }

        # ── Route: Auth Service ───────────────────────────────────────────────
        location /api/auth {
            proxy_pass         http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Route: Course Service ─────────────────────────────────────────────
        location /api/courses {
            proxy_pass         http://course_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Route: Progress Service ───────────────────────────────────────────
        location /api/progress {
            proxy_pass         http://progress_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Route: Notification Service ───────────────────────────────────────
        location /api/notifications {
            proxy_pass         http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Fallback ──────────────────────────────────────────────────────────
        location / {
            return 404 '{"error":"Route not found. Use /api/<service>/*"}\n';
            add_header Content-Type application/json;
        }
    }
}
